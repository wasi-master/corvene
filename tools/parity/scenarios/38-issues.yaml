# Corvene's Issues view (flag 345-issues, off in the GitHub Desktop preset
# the harness runs with). GHD has no issues list, so the snaps are
# recorded, not compared (`corvene_only`; deviations.md › GitHub layer).
# The issues come from the stub GitHub API (`github_stub.py`): three open,
# one closed, four labels, three assignable users; creating an issue
# answers #101.
name: issues
description: Repository › Issues… list, label and state filters, the issue pane, New Issue… and Create Branch from an issue (Corvene only, stub API)
setup: repo-remote
github_stub: true
corvene_flags: 345-issues=on
steps:
  - ghd: {skip: true}
    corvene: {github: stub}
    wait: 500
  - ghd: {skip: true}
    corvene: {action: "corvene::ShowIssues"}
    wait: 2000
  - snap: {name: list, corvene_only: true, note: "GHD has no issues list (deviations.md, 345-issues)"}
  # the `bug` label chip narrows the list to one issue
  - ghd: {skip: true}
    corvene: {click: [26, 197]}
    wait: 800
  - snap: {name: label-filter, corvene_only: true}
  - ghd: {skip: true}
    corvene: {click: [26, 197]}
    wait: 500
  # the state picker: Closed, then Assigned to me, then Open again
  - ghd: {skip: true}
    corvene: {click: [175, 171]}
    wait: 600
  - corvene_menu: issue-state
  - ghd: {skip: true}
    corvene: {click: [175, 171]}
    wait: 600
  - corvene_menu_pick: Closed
    wait: 800
  - snap: {name: closed, corvene_only: true}
  - ghd: {skip: true}
    corvene: {click: [175, 171]}
    wait: 600
  - corvene_menu_pick: Assigned to me
    wait: 800
  - snap: {name: assigned-to-me, corvene_only: true}
  - ghd: {skip: true}
    corvene: {click: [175, 171]}
    wait: 600
  - corvene_menu_pick: Open
    wait: 800
  # the filter box
  - ghd: {skip: true}
    corvene: {click: [55, 171]}
    wait: 300
  - ghd: {skip: true}
    corvene: {type: "dark"}
    wait: 800
  - snap: {name: filtered, corvene_only: true}
  - ghd: {skip: true}
    corvene: {key: "cmd-a"}
  - ghd: {skip: true}
    corvene: {key: backspace}
    wait: 600
  # the first row selected: the issue pane
  - ghd: {skip: true}
    corvene: {click: [103, 257]}
    wait: 1000
  - snap: {name: selected, corvene_only: true}
  - ghd: {skip: true}
    corvene: {rclick: [103, 257]}
    wait: 600
  - corvene_menu: issue-row
  # New Issue…
  - ghd: {skip: true}
    corvene: {click: [169, 129]}
    wait: 1200
  - snap: {name: new-issue, corvene_only: true}
  - ghd: {skip: true}
    corvene: {type: "Crash on launch"}
    wait: 400
  # the first label and the second assignee
  - ghd: {skip: true}
    corvene: {click: [417, 499]}
    wait: 300
  - ghd: {skip: true}
    corvene: {click: [703, 523]}
    wait: 400
  - snap: {name: new-issue-filled, corvene_only: true}
  # Create Issue: the stub answers #101, listed first and selected
  - ghd: {skip: true}
    corvene: {click: [904, 680]}
    wait: 2000
  - snap: {name: created, corvene_only: true}
  # Create Branch from the new issue: the dialog prefilled with 101-crash-on-launch
  - ghd: {skip: true}
    corvene: {click: [1160, 136]}
    wait: 1200
  - snap: {name: create-branch, corvene_only: true}
  - ghd: {skip: true}
    corvene: {key: escape}
    wait: 500
  # Escape closes the list: History as it was
  - ghd: {skip: true}
    corvene: {click: [103, 257]}
    wait: 400
  - ghd: {skip: true}
    corvene: {key: escape}
    wait: 800
  - snap: {name: closed-again, corvene_only: true}
---
# Without an account for the repository's host the view asks to sign in.
name: issues-signed-out
description: Repository › Issues… without an account for the repository's host (Corvene only)
setup: repo-remote
corvene_flags: 345-issues=on
steps:
  - ghd: {skip: true}
    corvene: {github: no-account}
    wait: 300
  - ghd: {skip: true}
    corvene: {action: "corvene::ShowIssues"}
    wait: 1500
  - snap: {name: signed-out, corvene_only: true}
