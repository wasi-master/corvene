# More image formats, sharp SVG drawings and zoom (1326-more-image-formats,
# 794-svg-image-diff, 1327-image-diff-zoom): Corvene shows an edited SVG
# with text as drawings, a HEIC photo and a TIFF scan as images and zooms
# in, then two Android drawables (1362-android-drawable-diff) as drawings;
# GitHub Desktop shows the SVG's and drawables' text and "This binary
# file has changed." for the others (deviations.md › Image diffs).
name: image-formats
description: An edited SVG, HEIC and TIFF in the image diff, then zoomed in (Corvene only)
setup: repo-images
corvene_flags: 1326-more-image-formats=on, 794-svg-image-diff=on, 1327-image-diff-zoom=on, 1362-android-drawable-diff=on
steps:
  - click: [125, 185]
    wait: 2000
  - snap: {name: svg, corvene_only: true, note: "794-svg-image-diff: drawings with their text, Image by default"}
  - click: [125, 214]
    wait: 2500
  - snap: {name: heic, corvene_only: true, note: "1326-more-image-formats: HEIC through ImageIO"}
  - click: [125, 243]
    wait: 2000
  - snap: {name: tiff, corvene_only: true, note: "1326-more-image-formats: TIFF"}
  - ghd: {skip: true}
    corvene: {click: [1288, 134]}
    wait: 400
  - ghd: {skip: true}
    corvene: {click: [1288, 134]}
    wait: 400
  - ghd: {skip: true}
    corvene: {click: [1288, 134]}
    wait: 1500
  - snap: {name: tiff-zoomed, corvene_only: true, note: "1327-image-diff-zoom: three steps of the + button"}
  - click: [125, 185]
    wait: 2000
  - ghd: {skip: true}
    corvene: {click: [1288, 134]}
    wait: 400
  - ghd: {skip: true}
    corvene: {click: [1288, 134]}
    wait: 400
  - ghd: {skip: true}
    corvene: {click: [1288, 134]}
    wait: 2000
  - snap: {name: svg-zoomed, corvene_only: true, note: "794-svg-image-diff: the drawing redrawn sharp at the new zoom"}
  - click: [125, 272]
    wait: 2000
  - snap: {name: drawable-shape, corvene_only: true, note: "1362-android-drawable-diff: a shape with @color fills from values/colors.xml"}
  - click: [125, 301]
    wait: 2000
  - snap: {name: drawable-vector, corvene_only: true, note: "1362-android-drawable-diff: a vector drawable recolored and rotated"}
