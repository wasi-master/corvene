name: CI

# macOS runners are scarce, so a push only runs what it has to: docs-only
# changes skip CI, a newer push to the same branch cancels the older run,
# rustfmt fails fast on Linux before any other runner is taken, builds carry
# no debug info, Android builds one ABI, and the release
# build + bundle run only on demand (Actions → CI → Run workflow). Tags build
# and bundle in release.yml.

on:
  push:
    branches: [main]
    paths: &code
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!LICENSE'
      - '!NOTICE'
      - '!packaging/homebrew/**'
      - '!.github/workflows/release.yml'
      # Markdown the tests read (highlighting samples)
      - 'crates/**/tests/**'
  pull_request:
    paths: *code
  workflow_dispatch:
    inputs:
      bundle:
        description: Also build and upload a signed Corvene.app
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # no debug info: less to compile, link and cache, and a failing test still
  # names its file and line
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: clippy · test (macOS)
    needs: fmt
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # PR runs read main's cache but do not write their own; a red run
          # on main still saves what it compiled
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # grammars built from source (crates/corvene-grammars/build.rs); the
      # tree-sitter tests need all of them
      - uses: ./.github/actions/grammar-sources
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # --no-fail-fast: one run names every failing crate's tests
      - name: test
        run: cargo test --workspace --no-fail-fast

      - name: build (release, precompiled Metal shaders)
        if: inputs.bundle
        run: cargo build --release --no-default-features -p corvene
      - name: code-signing certificate
        if: inputs.bundle
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: packaging/signing-cert.sh ci
      # Xcode 26's actool crashes on a macOS 15 host (its AssetCatalogAgent
      # links CoreMedia symbols only macOS 26 has), hence the macos-26 runner
      - name: bundle (Liquid Glass icon needs Xcode 26 actool)
        if: inputs.bundle
        run: |
          export DEVELOPER_DIR="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"
          packaging/bundle.sh release
          test -f target/bundle/Corvene.app/Contents/Resources/Assets.car
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' target/bundle/Corvene.app/Contents/Info.plist
          ditto -c -k --keepParent target/bundle/Corvene.app target/bundle/Corvene.app.zip
      - uses: actions/upload-artifact@v4
        if: inputs.bundle
        with:
          name: Corvene.app
          path: target/bundle/Corvene.app.zip

  linux:
    name: clippy · test (Linux)
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # GPUI's X11 / Wayland backends; mold is the linker .cargo/config.toml
      # sets for x86_64 Linux
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang mold pkg-config \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libasound2-dev \
            gnome-keyring dbus-x11 zip unzip hunspell-en-us rpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: ./.github/actions/grammar-sources
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # the keyring and notification tests talk to a session bus
      - name: test
        run: dbus-run-session -- cargo test --workspace --no-fail-fast
      # account tokens go through the secret service, never to disk in plain text
      - name: keyring round trip (gnome-keyring)
        run: dbus-run-session -- packaging/linux/keyring-test.sh
      # the .deb layout from a debug binary (release.yml packages the
      # release build); `cargo test` builds no binary for a crate without
      # integration tests
      - name: package smoke test (.deb, .rpm, .tar.gz)
        run: |
          cargo build -p corvene
          PACKAGE_BIN=target/debug/corvene FORMATS="deb rpm tar" packaging/linux/package.sh
          layout='usr/lib/corvene/corvene$|usr/lib/corvene/bin/corvene$|usr/bin/corvene|applications/com.wasimaster.corvene.desktop$|metainfo/com.wasimaster.corvene.metainfo.xml$'
          deb="$(ls target/linux/corvene_*_amd64.deb)"
          dpkg-deb --info "$deb"
          [[ "$(dpkg-deb --contents "$deb" | grep -cE "$layout")" -eq 5 ]]
          rpm="$(ls target/linux/corvene-*.x86_64.rpm)"
          rpm -qip "$rpm"
          rpm -qp --requires "$rpm" | grep -q '^/usr/bin/git$'
          [[ "$(rpm -qlp "$rpm" | grep -cE "$layout")" -eq 5 ]]
          [[ "$(tar -tzf target/linux/Corvene-*-linux-x86_64.tar.gz | grep -cE "$layout")" -eq 5 ]]
          python3 packaging/aur/stamp.py --version "$(ls target/linux/Corvene-*-linux-x86_64.tar.gz | sed -E 's/.*Corvene-(.*)-linux-x86_64.tar.gz/\1/')" --assets target/linux --out target/aur
          bash -n target/aur/corvene-bin/PKGBUILD
          CORVENE_CLI_DRY_RUN=1 packaging/linux/corvene.sh open . | grep -q '^x-corvene://openLocalRepo/'


  # MSVC; GPUI's DirectX backend needs nothing installed. Git for Windows on
  # the runner checks text out with CRLF unless .gitattributes says otherwise
  # (it does).
  windows:
    name: clippy · test (Windows)
    needs: fmt
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: ./.github/actions/grammar-sources
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --no-fail-fast
      - uses: ./.github/actions/inno-setup
      # the installer, the .msi and the portable zip from a debug binary
      # (release.yml packages the release build), and the command line
      # tool's batch file
      - name: package smoke test (installer, .msi, portable zip)
        shell: pwsh
        run: |
          cargo build -p corvene
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $env:PACKAGE_BIN = "target\debug\corvene.exe"
          packaging\windows\package.ps1
          if (-not (Get-ChildItem target\windows\Corvene-*-x86_64-setup.exe)) { throw "no installer" }
          if (-not (Get-ChildItem target\windows\Corvene-*-x86_64.msi)) { throw "no .msi" }
          $zip = Get-ChildItem target\windows\Corvene-*-windows-x86_64-portable.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries.FullName -replace '\\', '/'
          if (-not ($entries -contains "Corvene/corvene.exe" -and $entries -contains "Corvene/bin/corvene.bat")) { throw "the portable zip lacks corvene.exe or bin/corvene.bat: $entries" }
          $help = cmd /c packaging\windows\corvene.bat --help
          if (-not ($help -match "Corvene CLI usage")) { throw "the command line tool printed no usage" }

  # Both Android packages (foss and play) from one native library, on a
  # Linux runner: cargo-ndk cross-compiles, Gradle packages. One ABI is
  # enough to check a push (release.yml builds all four). The bundled git
  # (packaging/android/git) is cross-built once and cached.
  android:
    name: clippy · package (Android)
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.3.13750724
      ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: install the NDK
        run: |
          # `yes |` under pipefail fails the step when sdkmanager stops reading
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" < <(yes) > "$RUNNER_TEMP/sdkmanager.log" 2>&1 && break
            tail -n 30 "$RUNNER_TEMP/sdkmanager.log"
            [[ $attempt == 3 ]] && exit 1
            sleep 15
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: cache the bundled git
        uses: actions/cache@v4
        with:
          path: packaging/android/app/src/main/jniLibs
          key: android-git-${{ env.ABIS }}-${{ env.NDK_VERSION }}-${{ hashFiles('packaging/android/git/**') }}
      # rustc reports this lint for thread locals only on Android targets
      - name: clippy
        run: >
          cargo ndk -t arm64-v8a -P 26 clippy -p corvene --lib --
          -D warnings -A clippy::missing_const_for_thread_local
      - name: package (foss and play)
        run: packaging/android/build.sh debug
      # the bundle Google Play takes, with one grammar in the on-demand
      # module (release.yml builds them all)
      - name: bundle (play, with the grammar module)
        run: |
          UNITS=json packaging/android/grammars.sh
          cd packaging/android && ./gradlew --no-daemon :app:bundlePlayDebug
          unzip -l app/build/outputs/bundle/playDebug/app-play-debug.aab | grep -q 'grammars/lib/arm64-v8a/libcorvene_ts_index.so'
      - name: the play package asks for no all files access
        run: |
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)"
          "$aapt" dump permissions packaging/android/app/build/outputs/apk/foss/debug/app-foss-debug.apk | grep -q MANAGE_EXTERNAL_STORAGE
          ! "$aapt" dump permissions packaging/android/app/build/outputs/apk/play/debug/app-play-debug.apk | grep -q MANAGE_EXTERNAL_STORAGE
      - uses: actions/upload-artifact@v4
        with:
          name: corvene-android-legacy-debug
          path: packaging/android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

  # The Compose app (android/, com.wasimaster.corvene): Gradle runs cargo-ndk
  # for corvene-ffi (one ABI), generates the UniFFI bindings, runs every
  # module's unit tests, detekt, Android Lint and the architecture rules, and
  # packages the foss debug APK, whose parts are measured against the budget
  # and whose libraries must be 16 KB aligned. The bundled git is the same
  # as the legacy app's, from the same cache.
  android-compose:
    name: test · package (Android, Compose)
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.3.13750724
      ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-compose
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # the host-side uniffi-bindgen links with mold (.cargo/config.toml)
      - name: mold
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: install the NDK
        run: |
          # `yes |` under pipefail fails the step when sdkmanager stops reading
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" < <(yes) > "$RUNNER_TEMP/sdkmanager.log" 2>&1 && break
            tail -n 30 "$RUNNER_TEMP/sdkmanager.log"
            [[ $attempt == 3 ]] && exit 1
            sleep 15
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: cache the bundled git
        uses: actions/cache@v4
        with:
          path: packaging/android/app/src/main/jniLibs
          key: android-git-${{ env.ABIS }}-${{ env.NDK_VERSION }}-${{ hashFiles('packaging/android/git/**') }}
      - name: clippy (corvene-ffi, Android target)
        run: >
          cargo ndk -t arm64-v8a -P 26 clippy -p corvene-ffi --lib --
          -D warnings -A clippy::missing_const_for_thread_local
      # standalone bindgen: the bindings come from tools/uniffi-bindgen, not
      # from a host build of the engine
      - name: unit tests, static analysis, package (foss debug)
        working-directory: android
        run: >
          ./gradlew --no-daemon -Pcorvene.uniffiBindgen=standalone
          unitTests staticAnalysis
          :app:assembleFossDebug :app:checkApkSizeFossDebug :app:checkElfAlignmentFossDebug
      - uses: actions/upload-artifact@v4
        with:
          name: corvene-android-compose-debug
          path: android/app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: corvene-android-compose-reports
          path: |
            android/**/build/reports/**
            android/**/build/test-results/**
          if-no-files-found: ignore
