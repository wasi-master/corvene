name: Release

# A `v<version>` tag builds the release assets (packaging/release.md) and
# uploads them to a *draft* GitHub release. The self-updater skips drafts, so
# nothing reaches users until the maintainer writes the notes ([New] /
# [Improved] / [Fixed] items) and publishes it.
#
# Every platform builds at once, as workflow artifacts; `publish` collects
# them once all of them are through. Each platform builds the default and
# the Corvene-Full variant (every tree-sitter grammar compiled in). Nothing here runs fmt, clippy or the
# tests: ci.yml does on every push to main, so tag a commit CI has passed. The on-demand packs do
# not go on the app's release: they live on the rolling `packs` release
# (never the latest one), and are only built when it lacks the pack version
# in the tree.
#
# Run by hand (Actions → Release → Run workflow) to build the assets as
# workflow artifacts without creating a release. With `linux_release` set to
# an existing release's tag, a run by hand skips macOS and Android and adds
# the Linux assets (built from the branch it runs on) to that release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      full:
        description: Also build the Corvene-Full variants (the tree-sitter grammars compiled in)
        type: boolean
        default: true
      linux_release:
        description: Add the Linux assets to this existing release (its tag, like v0.1.0) and skip macOS and Android
        type: string
        default: ''
      publish_packs:
        description: Rebuild every pack and publish it to the `packs` release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # C code (tree-sitter, grammars) targets Info.plist's LSMinimumSystemVersion
  MACOSX_DEPLOYMENT_TARGET: '10.15'
  # the release the assets go to: the pushed tag, or `linux_release`
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.linux_release }}
  # the rolling release the packs and their manifest live on
  PACKS_TAG: packs

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      variants: ${{ steps.version.outputs.variants }}
      packs: ${{ steps.packs.outputs.packs }}
    steps:
      - uses: actions/checkout@v4
      - name: version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::release $RELEASE_TAG does not match Cargo.toml version $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != "tag" && -n "$RELEASE_TAG" ]]; then
            gh release view "$RELEASE_TAG" --json tagName > /dev/null
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" || "$FULL" == "true" ]]; then
            echo 'variants=["default","full"]' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["default"]' >> "$GITHUB_OUTPUT"
          fi
      # A pack is installed by version, so one that is published is never
      # built again: bump its version to ship new grammars.
      - name: packs to build
        id: packs
        env:
          FORCE: ${{ inputs.publish_packs }}
          LINUX_ONLY: ${{ inputs.linux_release }}
        run: |
          want="$(packaging/packs.sh --version)"
          curl -fsSL -o have.json \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$PACKS_TAG/packs-manifest.json" \
            || echo '{"packs": []}' > have.json
          python3 - "$want" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          want = sys.argv[1]
          jobs = [
              {"name": "macos", "runner": "macos-26", "targets": ["macos-aarch64", "macos-x86_64"]},
              {"name": "linux-x86_64", "runner": "ubuntu-24.04", "targets": ["linux-x86_64"]},
              {"name": "linux-aarch64", "runner": "ubuntu-24.04-arm", "targets": ["linux-aarch64"]},
              # the 32-bit ones, cross-built with the target's gcc toolchain
              # and libc headers (which clang finds) on the runner of the same family
              {"name": "linux-i686", "runner": "ubuntu-24.04", "targets": ["linux-i686"], "optional": True,
               "pack_targets": "i686-unknown-linux-gnu", "apt": "gcc-i686-linux-gnu libc6-dev-i386-cross", "nm": "i686-linux-gnu-nm"},
              {"name": "linux-armv7", "runner": "ubuntu-24.04-arm", "targets": ["linux-armv7"], "optional": True,
               "pack_targets": "armv7-unknown-linux-gnueabihf", "apt": "gcc-arm-linux-gnueabihf libc6-dev-armhf-cross", "nm": "arm-linux-gnueabihf-nm"},
              {"name": "android", "runner": "ubuntu-24.04", "targets": ["android-aarch64", "android-armv7a", "android-x86_64", "android-i686"]},
              {"name": "windows-x86_64", "runner": "windows-latest", "targets": ["windows-x86_64"]},
              # Git Bash is x64 there, so uname -m says x86_64
              {"name": "windows-aarch64", "runner": "windows-11-arm", "targets": ["windows-aarch64"],
               "pack_targets": "aarch64-pc-windows-msvc"},
              {"name": "windows-i686", "runner": "windows-latest", "targets": ["windows-i686"], "optional": True,
               "pack_targets": "i686-pc-windows-msvc"},
          ]
          have = {(p["name"], p["version"], p.get("target")) for p in json.load(open("have.json"))["packs"]}
          force = os.environ["FORCE"] == "true"
          build = []
          for job in jobs:
              if os.environ["LINUX_ONLY"] and not job["name"].startswith("linux"):
                  continue
              targets = job.pop("targets")
              missing = any(
                  (f"tree-sitter-{variant}", want, target) not in have
                  for variant in ("all", "rest")
                  for target in targets
              )
              if force or missing:
                  build.append(job)
          print("packs=" + json.dumps(build))
          PY
          cat "$GITHUB_OUTPUT"

  # One runner per architecture and variant: the release profile (fat LTO,
  # one codegen unit) takes a quarter of an hour per binary.
  macos-build:
    name: build (macOS ${{ matrix.target }}, ${{ matrix.variant }})
    needs: plan
    if: ${{ !inputs.linux_release }}
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Xcode 26: metal for the precompiled shaders
      - name: select Xcode 26
        run: echo "DEVELOPER_DIR=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          # a tag's run reads main's caches, never another tag's: only a run
          # by hand on main (which every later tag can read) saves one
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.variant == 'default' }}
      # the full build links every grammar in
      - uses: ./.github/actions/grammar-sources
        if: matrix.variant == 'full'
      - name: build
        env:
          CORVENE_GITHUB_CLIENT_SECRET: ${{ secrets.CORVENE_GITHUB_CLIENT_SECRET }}
        run: |
          # an empty secret must not count as "has a client secret" (307-sign-in-flow)
          [[ -n "$CORVENE_GITHUB_CLIENT_SECRET" ]] || unset CORVENE_GITHUB_CLIENT_SECRET
          cargo build --release -p corvene --no-default-features \
            ${{ matrix.variant == 'full' && '--features full' || '' }} --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.variant }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/corvene
          retention-days: 1

  macos-assets:
    name: bundle · sign (macOS)
    needs: [plan, macos-build]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Xcode 26: actool for the Liquid Glass icon (crashes on a macOS 15 host,
      # hence macos-26)
      - name: select Xcode 26
        run: echo "DEVELOPER_DIR=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins
      - name: code-signing certificate
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: packaging/signing-cert.sh ci
      - name: assets
        env:
          VARIANTS: ${{ join(fromJSON(needs.plan.outputs.variants), ' ') }}
        run: |
          for variant in $VARIANTS; do
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              mkdir -p "target/$t/release"
              cp "bins/bin-$variant-$t/corvene" "target/$t/release/corvene"
              chmod +x "target/$t/release/corvene"
            done
            # the universal bundle, and one per architecture for a smaller download
            for arch in universal arm64 x86_64; do
              ARCH="$arch" FULL="$([[ "$variant" == full ]] && echo 1 || echo 0)" SKIP_BUILD=1 packaging/release.sh
            done
          done
          ls -l target/release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: assets-macos
          path: |
            target/release-assets/*.zip
            target/release-assets/*.dmg
          compression-level: 0

  # The .deb, .rpm, .tar.gz and AppImage of each architecture and variant
  # (packaging/linux/package.sh). x86_64 and aarch64 build natively. The
  # 32-bit ones are cross-compiled on the runner of the same family (Debian
  # multiarch has their libraries) and may fail without holding up the
  # release: nothing upstream of Corvene (GPUI least of all) is tested on
  # 32-bit Linux.
  linux:
    name: build · package (Linux ${{ matrix.arch }}, ${{ matrix.variant }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, i686, armhf]
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
        include:
          - arch: x86_64
            host: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            host: aarch64
            runner: ubuntu-24.04-arm
          - arch: i686
            host: x86_64
            runner: ubuntu-24.04
            target: i686-unknown-linux-gnu
            foreign: i386
            triplet: i386-linux-gnu
            gcc: gcc-i686-linux-gnu g++-i686-linux-gnu
          - arch: armhf
            host: aarch64
            runner: ubuntu-24.04-arm
            target: armv7-unknown-linux-gnueabihf
            foreign: armhf
            triplet: arm-linux-gnueabihf
            gcc: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.target != '' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: system packages
        if: ${{ !matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang mold pkg-config rpm \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libasound2-dev
      - name: system packages (cross)
        if: matrix.target
        run: |
          sudo dpkg --add-architecture ${{ matrix.foreign }}
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld pkg-config rpm ${{ matrix.gcc }} \
            libxcb1-dev:${{ matrix.foreign }} libxkbcommon-dev:${{ matrix.foreign }} \
            libxkbcommon-x11-dev:${{ matrix.foreign }} libwayland-dev:${{ matrix.foreign }} \
            libfontconfig-dev:${{ matrix.foreign }} libfreetype-dev:${{ matrix.foreign }} \
            libvulkan-dev:${{ matrix.foreign }} libasound2-dev:${{ matrix.foreign }}
          {
            echo "TARGET=${{ matrix.target }}"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_LIBDIR=/usr/lib/${{ matrix.triplet }}/pkgconfig:/usr/share/pkgconfig"
            # Thumb-2 conditional branches reach 1 MiB, too short for the
            # biggest grammar parsers: build the C code in ARM mode
            # and link with lld: BFD ld asserts on the full build's grammars
            if [[ "${{ matrix.arch }}" == armhf ]]; then
              echo "CFLAGS_armv7_unknown_linux_gnueabihf=-marm"
              echo "CXXFLAGS_armv7_unknown_linux_gnueabihf=-marm"
              echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUSTFLAGS=-C link-arg=-fuse-ld=lld"
            fi
          } >> "$GITHUB_ENV"
          # a cross gcc's -fuse-ld=lld runs <triplet>-ld.lld from PATH
          if [[ "${{ matrix.arch }}" == armhf ]]; then
            sudo ln -sf "$(command -v ld.lld || ls /usr/lib/llvm-*/bin/ld.lld | tail -n 1)" \
              "/usr/local/bin/${{ matrix.triplet }}-ld.lld"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.variant == 'default' }}
      # the full build links every grammar in
      - uses: ./.github/actions/grammar-sources
        if: matrix.variant == 'full'

      - name: appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.host }}.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          # no FUSE on the runner
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: build and package
        env:
          CORVENE_GITHUB_CLIENT_SECRET: ${{ secrets.CORVENE_GITHUB_CLIENT_SECRET }}
          FULL: ${{ matrix.variant == 'full' && '1' || '0' }}
        run: |
          [[ -n "$CORVENE_GITHUB_CLIENT_SECRET" ]] || unset CORVENE_GITHUB_CLIENT_SECRET
          packaging/linux/package.sh
          ls -l target/linux
      - uses: actions/upload-artifact@v4
        with:
          name: assets-linux-${{ matrix.arch }}-${{ matrix.variant }}
          path: |
            target/linux/*.deb
            target/linux/*.rpm
            target/linux/*.tar.gz
            target/linux/*.AppImage
          compression-level: 0

  # The Flatpak bundle of each 64-bit architecture and variant, made from the
  # `linux` job's .tar.gz (packaging/flatpak). Flathub's runtime has no
  # 32-bit builds. Not on Flathub; a failure does not hold up the release.
  flatpak:
    name: Flatpak (${{ matrix.arch }}, ${{ matrix.variant }})
    needs: [plan, linux]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assets-linux-${{ matrix.arch }}-${{ matrix.variant }}
          path: linux
      - name: flatpak-builder
        run: |
          sudo apt-get update
          # elfutils: flatpak-builder strips with eu-strip; librsvg2-common:
          # the export checks the SVG icon with the host's gdk-pixbuf
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common
      - name: build
        run: |
          packaging/flatpak/build.sh linux/*-linux-${{ matrix.arch }}.tar.gz target/flatpak-out
          ls -l target/flatpak-out
      - uses: actions/upload-artifact@v4
        with:
          name: assets-flatpak-${{ matrix.arch }}-${{ matrix.variant }}
          path: target/flatpak-out/*.flatpak
          compression-level: 0

  # The snap of each 64-bit architecture and variant (strict confinement,
  # core24), made from the `linux` job's .tar.gz (packaging/snap) with
  # snapcraft in LXD. Not in the Snap Store; a failure does not hold up the
  # release.
  snap:
    name: snap (${{ matrix.arch }}, ${{ matrix.variant }})
    needs: [plan, linux]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assets-linux-${{ matrix.arch }}-${{ matrix.variant }}
          path: linux
      - name: prepare
        run: packaging/snap/prepare.sh linux/*-linux-${{ matrix.arch }}.tar.gz target/snap
      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: target/snap
      - name: rename
        env:
          SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
          NAME: ${{ matrix.variant == 'full' && 'Corvene-Full' || 'Corvene' }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p target/snap-out
          mv "$SNAP_FILE" "target/snap-out/$NAME-$VERSION-${{ matrix.arch }}.snap"
          ls -l target/snap-out
      - uses: actions/upload-artifact@v4
        with:
          name: assets-snap-${{ matrix.arch }}-${{ matrix.variant }}
          path: target/snap-out/*.snap
          compression-level: 0

  # The Windows packages (packaging/windows/package.ps1: the per-user Inno
  # Setup installer, the machine-wide .msi and the portable .zip), one job
  # per architecture and variant. x86_64 and aarch64 build natively; the 32-bit one is
  # cross-compiled on the x86_64 runner and, like Linux's, is not something
  # GPUI is tested on. No job here holds up the release. The installers are
  # Authenticode-signed when the WINDOWS_SIGNING_PFX_BASE64 secret holds a
  # certificate (packaging/release.md); without one SmartScreen warns about
  # the download.
  windows:
    name: build · package (Windows ${{ matrix.arch }}, ${{ matrix.variant }})
    needs: plan
    if: ${{ !inputs.linux_release }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, i686]
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
        include:
          - arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - arch: i686
            runner: windows-latest
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.variant == 'default' }}
      # the full build links every grammar in
      - uses: ./.github/actions/grammar-sources
        if: matrix.variant == 'full'
      - uses: ./.github/actions/inno-setup
      # WiX 5 (MS-RL): 6 and later need the Open Source Maintenance Fee EULA
      - name: WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: build and package
        shell: pwsh
        env:
          CORVENE_GITHUB_CLIENT_SECRET: ${{ secrets.CORVENE_GITHUB_CLIENT_SECRET }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          TARGET: ${{ matrix.target }}
          FULL: ${{ matrix.variant == 'full' && '1' || '0' }}
        run: |
          if (-not $env:CORVENE_GITHUB_CLIENT_SECRET) { Remove-Item Env:CORVENE_GITHUB_CLIENT_SECRET -ErrorAction SilentlyContinue }
          if ($env:WINDOWS_SIGNING_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "corvene-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            $env:SIGN_PFX = $pfx
          }
          try {
            packaging\windows\package.ps1
          } finally {
            if ($env:SIGN_PFX) { Remove-Item $env:SIGN_PFX -Force -ErrorAction SilentlyContinue }
          }
          Get-ChildItem target\windows
      - uses: actions/upload-artifact@v4
        with:
          name: assets-windows-${{ matrix.arch }}-${{ matrix.variant }}
          path: |
            target/windows/*-setup.exe
            target/windows/*.msi
            target/windows/*-portable.zip
          compression-level: 0

  # The legacy Android packages (the desktop app in a NativeActivity,
  # com.wasimaster.corvene.legacy; foss and play: one per ABI and one with all four) on a Linux
  # runner; also the play flavour's bundle (.aab, with the grammars as an
  # on-demand module), which stays a workflow artifact: it is uploaded to
  # Google Play by hand. The APKs are signed with the keystore in the
  # CORVENE_ANDROID_KEYSTORE_BASE64 secret and only then added to the draft
  # release; without it they stay workflow artifacts, unsigned. A failure
  # here does not hold up the other platforms. The Corvene-Full variant is
  # the foss flavour with every grammar compiled in, one package per ABI
  # (one with all four would be several hundred MB): Google Play gets the
  # grammars as a module instead.
  android:
    name: build · sign (Android, ${{ matrix.variant }})
    needs: plan
    if: ${{ !inputs.linux_release }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    continue-on-error: true
    env:
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-android
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.variant == 'default' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: install the NDK
        run: |
          # `yes |` under pipefail fails the step when sdkmanager stops reading
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" < <(yes) > "$RUNNER_TEMP/sdkmanager.log" 2>&1 && break
            tail -n 30 "$RUNNER_TEMP/sdkmanager.log"
            [[ $attempt == 3 ]] && exit 1
            sleep 15
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      # the play bundle's grammar module, the full library
      - uses: ./.github/actions/grammar-sources
      - name: cache the bundled git
        uses: actions/cache@v4
        with:
          path: packaging/android/app/src/main/jniLibs
          key: android-git-4abi-${{ env.NDK_VERSION }}-${{ hashFiles('packaging/android/git/**') }}
      - name: build and package
        env:
          CORVENE_GITHUB_CLIENT_SECRET: ${{ secrets.CORVENE_GITHUB_CLIENT_SECRET }}
          CORVENE_ANDROID_KEYSTORE_BASE64: ${{ secrets.CORVENE_ANDROID_KEYSTORE_BASE64 }}
          CORVENE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CORVENE_ANDROID_KEYSTORE_PASSWORD }}
          CORVENE_ANDROID_KEY_ALIAS: ${{ secrets.CORVENE_ANDROID_KEY_ALIAS }}
          CORVENE_ANDROID_KEY_PASSWORD: ${{ secrets.CORVENE_ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          [[ -n "$CORVENE_GITHUB_CLIENT_SECRET" ]] || unset CORVENE_GITHUB_CLIENT_SECRET
          suffix=-unsigned
          if [[ -n "$CORVENE_ANDROID_KEYSTORE_BASE64" ]]; then
            umask 077
            printf '%s' "$CORVENE_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/corvene.jks"
            export CORVENE_ANDROID_KEYSTORE="$RUNNER_TEMP/corvene.jks"
            suffix=
          fi
          mkdir -p target/android
          outputs=packaging/android/app/build/outputs
          abis="arm64-v8a:arm64 armeabi-v7a:armv7 x86_64:x86_64 x86:x86"
          if [[ "${{ matrix.variant }}" == full ]]; then
            # FULL=1: the grammars compiled into the library; foss only, per ABI
            FULL=1 PER_ABI=1 packaging/android/build.sh release foss
            rm -f "$RUNNER_TEMP/corvene.jks"
            for abi in $abis; do
              cp "$outputs/per-abi/foss-${abi%%:*}.apk" "target/android/Corvene-Legacy-Full-$VERSION-android-foss-${abi##*:}$suffix.apk"
            done
            ls -l target/android
            exit 0
          fi
          # BUNDLE=1: also the .aab for Google Play with the grammar module;
          # PER_ABI=1: a package per ABI next to the one with all four
          BUNDLE=1 PER_ABI=1 packaging/android/build.sh release
          rm -f "$RUNNER_TEMP/corvene.jks"
          cp $outputs/bundle/playRelease/*.aab "target/android/Corvene-Legacy-$VERSION-android-play$suffix.aab"
          for flavour in foss play; do
            apk="$(ls $outputs/apk/$flavour/release/*.apk | head -1)"
            cp "$apk" "target/android/Corvene-Legacy-$VERSION-android-$flavour-universal$suffix.apk"
            for abi in $abis; do
              cp "$outputs/per-abi/$flavour-${abi%%:*}.apk" "target/android/Corvene-Legacy-$VERSION-android-$flavour-${abi##*:}$suffix.apk"
            done
          done
          ls -l target/android
      - uses: actions/upload-artifact@v4
        with:
          name: assets-android-${{ matrix.variant }}
          path: target/android/*
          compression-level: 0

  # The Compose app (android/, com.wasimaster.corvene): Gradle builds
  # corvene-ffi for all four ABIs through cargo-ndk, one APK per ABI plus a
  # universal one for the foss and play flavours, and the play bundle, which
  # stays a workflow artifact for Google Play. Signed with the same keystore
  # as the legacy app when the secret is set, unsigned otherwise. The Full
  # variant is the foss flavour with every grammar compiled in, per ABI. The
  # release APK's parts must stay within android/app/apk-budget.txt.
  android-compose:
    name: build · sign (Android Compose, ${{ matrix.variant }})
    needs: plan
    if: ${{ !inputs.linux_release }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    continue-on-error: true
    env:
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-android-compose
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.variant == 'default' }}
      # the host-side uniffi-bindgen links with mold (.cargo/config.toml)
      - name: mold
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: install the NDK
        run: |
          # `yes |` under pipefail fails the step when sdkmanager stops reading
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" < <(yes) > "$RUNNER_TEMP/sdkmanager.log" 2>&1 && break
            tail -n 30 "$RUNNER_TEMP/sdkmanager.log"
            [[ $attempt == 3 ]] && exit 1
            sleep 15
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      # the full variant compiles every grammar in
      - uses: ./.github/actions/grammar-sources
        if: matrix.variant == 'full'
      - name: cache the bundled git
        uses: actions/cache@v4
        with:
          path: packaging/android/app/src/main/jniLibs
          key: android-git-4abi-${{ env.NDK_VERSION }}-${{ hashFiles('packaging/android/git/**') }}
      - name: build and package
        working-directory: android
        env:
          CORVENE_GITHUB_CLIENT_SECRET: ${{ secrets.CORVENE_GITHUB_CLIENT_SECRET }}
          CORVENE_ANDROID_KEYSTORE_BASE64: ${{ secrets.CORVENE_ANDROID_KEYSTORE_BASE64 }}
          CORVENE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CORVENE_ANDROID_KEYSTORE_PASSWORD }}
          CORVENE_ANDROID_KEY_ALIAS: ${{ secrets.CORVENE_ANDROID_KEY_ALIAS }}
          CORVENE_ANDROID_KEY_PASSWORD: ${{ secrets.CORVENE_ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.plan.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          [[ -n "$CORVENE_GITHUB_CLIENT_SECRET" ]] || unset CORVENE_GITHUB_CLIENT_SECRET
          suffix=-unsigned
          if [[ -n "$CORVENE_ANDROID_KEYSTORE_BASE64" ]]; then
            umask 077
            printf '%s' "$CORVENE_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/corvene.jks"
            export CORVENE_ANDROID_KEYSTORE="$RUNNER_TEMP/corvene.jks"
            suffix=
          fi
          # the run number keeps versionCode growing from release to release
          common=(--no-daemon -Pcorvene.uniffiBindgen=standalone -Pcorvene.splitApks=true
                  "-Pcorvene.versionCode=$GITHUB_RUN_NUMBER")
          out=app/build/outputs
          mkdir -p "$RUNNER_TEMP/assets"
          abis="arm64-v8a:arm64 armeabi-v7a:armv7 x86_64:x86_64 x86:x86"
          copy_apks() { # <flavour> <asset prefix>
            for abi in $abis; do
              # x86 must not match x86_64: the ABI sits between dashes
              apk="$(ls "$out/apk/$1/release/"*"-${abi%%:*}-release"*.apk | head -1)"
              cp "$apk" "$RUNNER_TEMP/assets/$2-$VERSION-android-$1-${abi##*:}$suffix.apk"
            done
          }
          if [[ "$VARIANT" == full ]]; then
            ./gradlew "${common[@]}" -Pcorvene.rustFeatures=full :app:assembleFossRelease :app:checkElfAlignmentFossRelease
            rm -f "$RUNNER_TEMP/corvene.jks"
            copy_apks foss Corvene-Full
          else
            # the Play bundle first, on its own: AGP refuses a bundle while
            # per-ABI APK splits are on
            ./gradlew "${common[@]/-Pcorvene.splitApks=true/-Pcorvene.splitApks=false}" :app:bundlePlayRelease
            cp "$out"/bundle/playRelease/*.aab "$RUNNER_TEMP/assets/Corvene-$VERSION-android-play$suffix.aab"
            ./gradlew "${common[@]}" \
              :app:assembleFossRelease :app:assemblePlayRelease \
              :app:checkElfAlignmentFossRelease :app:checkElfAlignmentPlayRelease
            rm -f "$RUNNER_TEMP/corvene.jks"
            for flavour in foss play; do
              copy_apks "$flavour" Corvene
              universal="$(ls "$out/apk/$flavour/release/"*universal*.apk | head -1)"
              cp "$universal" "$RUNNER_TEMP/assets/Corvene-$VERSION-android-$flavour-universal$suffix.apk"
            done
          fi
          ls -l "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@v4
        with:
          name: assets-android-compose-${{ matrix.variant }}
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error
          compression-level: 0
      # the budget (android/app/apk-budget.txt) is reported after the assets
      # are up: over budget turns the job yellow, not the release empty
      - name: APK size budget
        if: matrix.variant == 'default'
        continue-on-error: true
        working-directory: android
        run: ./gradlew --no-daemon -Pcorvene.uniffiBindgen=standalone -Pcorvene.splitApks=true "-Pcorvene.versionCode=$GITHUB_RUN_NUMBER" :app:checkApkSizeFossRelease

  # The tree-sitter packs `plan` found missing from the `packs` release, one
  # job per platform (macOS and Android build both architectures from one
  # runner, Linux builds each natively).
  packs:
    name: tree-sitter packs (${{ matrix.name }})
    needs: plan
    if: ${{ needs.plan.outputs.packs != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.packs) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.name == 'android' || startsWith(matrix.name, 'windows') || matrix.optional == true }}
    # Windows: packs.sh runs in Git Bash, with the runner's LLVM clang
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v4
      - name: clang
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ${{ matrix.apt }}
      # packs.sh builds for every macOS Rust target that is installed
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.name == 'macos'
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: actions/setup-java@v4
        if: matrix.name == 'android'
        with:
          distribution: temurin
          java-version: 21
      - name: install the NDK
        if: matrix.name == 'android'
        run: |
          # `yes |` under pipefail fails the step when sdkmanager stops reading
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" < <(yes) > "$RUNNER_TEMP/sdkmanager.log" 2>&1 && break
            tail -n 30 "$RUNNER_TEMP/sdkmanager.log"
            [[ $attempt == 3 ]] && exit 1
            sleep 15
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "PACK_OS=android" >> "$GITHUB_ENV"
      - uses: ./.github/actions/grammar-sources
      - name: build
        env:
          # the 32-bit packs: cross-built for these Rust targets
          PACK_TARGETS: ${{ matrix.pack_targets }}
          NM: ${{ matrix.nm || 'nm' }}
        run: |
          packaging/packs.sh target/packs
          mv target/packs/packs-manifest.json "target/packs/packs-manifest-${{ matrix.name }}.json"
          ls -l target/packs
      - uses: actions/upload-artifact@v4
        with:
          name: packs-${{ matrix.name }}
          path: target/packs/*
          compression-level: 0

  # The archives first, then the manifest that points at them: an entry is
  # keyed by pack, version and platform, so older versions stay listed for
  # the apps that still need them.
  publish-packs:
    name: publish the packs
    needs: [plan, packs]
    if: ${{ !cancelled() && needs.packs.result != 'skipped' && (github.ref_type == 'tag' || inputs.linux_release || inputs.publish_packs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: packs-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packs-*
          merge-multiple: true
          path: packs
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          archives=(packs/*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "::error::no pack was built"
            exit 1
          fi
          if gh release view "$PACKS_TAG" --json tagName > /dev/null 2>&1; then
            gh release download "$PACKS_TAG" -p packs-manifest.json -D merged || true
          else
            gh release create "$PACKS_TAG" --latest=false --target "$GITHUB_SHA" \
              --title "Packs" \
              --notes "Optional components Corvene downloads on demand (Settings › Advanced): the tree-sitter grammars. Not an application release; see the latest release for Corvene itself."
          fi
          mkdir -p merged
          [[ -f merged/packs-manifest.json ]] || echo '{"schema": 1, "packs": []}' > merged/packs-manifest.json
          python3 - merged/packs-manifest.json packs/packs-manifest-*.json <<'PY'
          import json, sys
          path, *fragments = sys.argv[1:]
          manifest = json.load(open(path))
          key = lambda p: (p["name"], p["version"], p.get("target"))
          packs = {key(p): p for p in manifest["packs"]}
          for fragment in fragments:
              for p in json.load(open(fragment))["packs"]:
                  packs[key(p)] = p
          manifest["packs"] = list(packs.values())
          json.dump(manifest, open(path, "w"), indent=2)
          PY
          gh release upload "$PACKS_TAG" --clobber "${archives[@]}"
          gh release upload "$PACKS_TAG" --clobber merged/packs-manifest.json
          {
            echo "## Packs"
            echo
            echo '```'
            ls -l packs | tail -n +2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The draft release (or, with `linux_release`, the existing one) gets the
  # installers only and a Downloads table of them in its notes, and the
  # Homebrew cask its version and hashes.
  publish:
    name: draft release · Homebrew cask
    needs: [plan, macos-assets, linux, flatpak, snap, android, android-compose, windows]
    if: >-
      ${{ !cancelled() && needs.linux.result == 'success'
          && (inputs.linux_release || needs.macos-assets.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true
          path: assets
      # no macOS job in a `linux_release` run: the cask's half comes from the release's zip
      - name: the release's macOS zip
        if: inputs.linux_release
        run: gh release download "$RELEASE_TAG" -p "Corvene-$VERSION-macos-universal.zip" -D assets
      - name: upload
        if: env.RELEASE_TAG != ''
        run: |
          shopt -s nullglob
          # unsigned Android packages and the Play bundle stay workflow artifacts
          files=()
          for file in assets/*.zip assets/*.dmg assets/*.deb assets/*.rpm assets/*.tar.gz assets/*.AppImage \
              assets/*.flatpak assets/*.snap assets/*.apk assets/*-setup.exe assets/*.msi; do
            [[ "$file" == *-unsigned.apk ]] || files+=("$file")
          done
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber "${files[@]}"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "Corvene ${RELEASE_TAG#v}" \
              --notes "- [New] …" \
              "${files[@]}"
          fi
      # platforms as rows, architectures as columns, from what the release
      # holds by now (a `linux_release` run: the other platforms' assets too)
      - name: downloads table in the release notes
        if: env.RELEASE_TAG != ''
        run: |
          gh release view "$RELEASE_TAG" --json assets,body \
            | packaging/release-table.py --base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG" \
            > notes.md
          gh release edit "$RELEASE_TAG" --notes-file notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: stamp the cask
        run: |
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          packaging/homebrew/stamp.py --version "$VERSION" \
            --macos "$(sha "assets/Corvene-$VERSION-macos-universal.zip")" \
            --x86_64-linux "$(sha "assets/Corvene-$VERSION-x86_64.AppImage")" \
            --arm64-linux "$(sha "assets/Corvene-$VERSION-aarch64.AppImage")"
          {
            echo "## Corvene $VERSION"
            echo
            echo '```'
            ls -l assets | tail -n +2
            echo '```'
            echo
            echo "## Homebrew cask"
            echo
            echo "Copy the \`cask\` artifact's corvene.rb to wasi-master/homebrew-corvene after publishing the release."
            echo
            echo '```ruby'
            sed -n '/^  version/,/x86_64_linux/p' packaging/homebrew/Casks/corvene.rb
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cask
          path: packaging/homebrew/Casks/corvene.rb
      # corvene-bin and corvene-full-bin from the .tar.gz files, pushed to
      # the AUR by hand once the release is published (packaging/aur/stamp.py)
      - name: AUR packages
        run: |
          packaging/aur/stamp.py --version "$VERSION" --assets assets --out target/aur
          {
            echo
            echo "## AUR"
            echo
            echo "Copy the \`aur\` artifact's folders to the corvene-bin and corvene-full-bin AUR repositories after publishing the release."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: target/aur
          include-hidden-files: true
