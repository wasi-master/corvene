[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wasi-master/corvene"
rust-version = "1.92"

[workspace.dependencies]
# UI: GPUI via gpui-kit. Pin exactly; upgrade only on a dedicated branch.
gpui-kit = { version = "=0.7.0", default-features = false, features = ["component", "assets"] }
# Only referenced to toggle the `runtime_shaders` feature (no Xcode needed for dev builds).
gpui-pre-apple = "=0.3.7"

# Internal crates
corvene-core = { path = "crates/corvene-core" }
corvene-extensions = { path = "crates/corvene-extensions" }
corvene-fonts = { path = "crates/corvene-fonts" }
corvene-git = { path = "crates/corvene-git" }
corvene-github = { path = "crates/corvene-github" }
corvene-grammars = { path = "crates/corvene-grammars" }
corvene-highlight = { path = "crates/corvene-highlight" }
corvene-hosts = { path = "crates/corvene-hosts" }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig", "dump-load", "default-syntaxes"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
# Opt-in tree-sitter highlighting (grammars live in corvene-grammars / the tree-sitter packs)
tree-sitter = "0.27"
tree-sitter-language = "0.1"
libloading = "0.8"
corvene-models = { path = "crates/corvene-models" }
corvene-packs = { path = "crates/corvene-packs" }
corvene-platform = { path = "crates/corvene-platform" }
corvene-store = { path = "crates/corvene-store" }
# test-only (GitHub Desktop test port): dev-dependency of the crates below
corvene-test-support = { path = "crates/corvene-test-support" }
corvene-ui = { path = "crates/corvene-ui" }

# Git
gix = "0.88"

# Network + secrets
ureq = { version = "3.4", features = ["json"] }
keyring = "4.2"

# Infra
anyhow = "1"
thiserror = "2"
regex = "1"
# line and word diffs of diff lines (selection carry-over, intra-line changes)
similar = "2"
# `1322-pdf-diff`: PDF pages and text
hayro = "=0.7.1"
kurbo = "0.13"
# Markdown for PR bodies / comments (GHD renders `marked` in a sandboxed webview)
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rust-embed = "8"
dirs = "6"

# tree-sitter's query analysis and parser are C: unoptimised they take
# seconds on large highlight queries even in development builds
[profile.dev.package.tree-sitter]
opt-level = 3

# up to 192 KB of a diff is highlighted on the main thread (diff_view.rs
# `SYNC_HIGHLIGHT_BYTES`); unoptimised, that stalls dev builds for a second
[profile.dev.package.corvene-highlight]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.onig]
opt-level = 3
[profile.dev.package.onig_sys]
opt-level = 3

# reading back and PNG-encoding CORVENE_SNAPSHOT / parity harness frames:
# unoptimised, a 2734×1628 frame takes seconds (past the 30 s control reply
# under load)
[profile.dev.package.gpui-pre-apple]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# release code in a fraction of the shipped build's time (thin LTO across
# 16 codegen units instead of fat LTO in one) for trying a change at full
# speed locally (`cargo build --profile release-fast -p corvene`); shipped
# builds stay on `release`
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = false

# release code with symbols and a fast link, for `sample`/Instruments and the
# timings in .docs/perf.md (`cargo build --profile profiling -p corvene`)
[profile.profiling]
inherits = "release"
lto = "off"
codegen-units = 16
strip = false
debug = "line-tables-only"
incremental = false

# gpui-pre-macos: variable-font weights and glyph dilation like Chromium
# (src/text_system.rs) and a display link that pauses while the window is
# idle (src/window.rs); gpui-pre: text paints from its unsnapped layout origin
# (src/elements/text.rs); gpui-pre-linux: anchored popups on X11 (the context
# and menu bar menus; src/linux/x11) and offscreen frames; gpui-pre-wgpu:
# rendering a window's scene to an image, an opaque depth pass and a damage
# scissor (src/wgpu_renderer.rs);
# tree-sitter-scss: its build script passes a GCC flag MSVC refuses
# (bindings/rust/build.rs); tree-sitter-agda: its scanner reads before an
# empty array (src/scanner.c); gpui-pre-windows: anchored popups (the context
# menus; src/window.rs, src/events.rs); gpui-pre, gpui-pre-macos and
# gpui-pre-apple: no image codecs Corvene never decodes (Cargo.toml). All
# marked "Corvene patch".
[patch.crates-io]
tree-sitter-agda = { path = "vendor/tree-sitter-agda" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
tree-sitter-scss = { path = "vendor/tree-sitter-scss" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
