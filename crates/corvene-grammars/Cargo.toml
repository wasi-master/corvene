# Generated by tools/ts-queries/gen.py from tools/ts-queries/languages.toml; do not edit.
[package]
name = "corvene-grammars"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tree-sitter grammars and highlight queries for Corvene's opt-in tree-sitter highlighter"

[lib]
# rlib: the "full" build links every grammar in; cdylib: one pack unit per
# `lang-*` feature (packaging/packs.sh), loaded with dlopen.
crate-type = ["rlib", "cdylib"]

# A grammar package may use `tree-sitter` itself only in a version that
# resolves to corvene-highlight's (cargo refuses a second copy of the C
# runtime: `links = "tree-sitter"`). Grammars without a usable crate are
# built by build.rs from tools/ts-queries/fetch.py's sources (skipped when
# those are missing).
[features]
default = []
