[package]
name = "corvene-git"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Corvene git engine: gitoxide reads, git CLI writes"

[dependencies]
corvene-models.workspace = true
# flags 1329-font-diff / 1330-font-source-preview: sniffing, UFO components
corvene-fonts.workspace = true
gix.workspace = true
libc = "0.2"
dunce = "1"
# flag 789-non-utf8-diffs: legacy-encoded text
encoding_rs = "0.8"
chardetng = "1"
similar.workspace = true
# flag 1306-utf16-diffs: the decoded sides `git diff --no-index` compares
tempfile = "3"
# flag 1113-lfs-locks: `git lfs locks --json`
serde.workspace = true
serde_json.workspace = true
# flag 1323-archive-diff: zip and tar archives and single compressed files
# (pure Rust decoders only, so the cross builds stay free of C)
zip = { version = "8", default-features = false, features = ["deflate-flate2", "deflate64", "bzip2", "lzma", "xz"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz"] }
ruzstd = "0.9"
crc32fast = "1"
thiserror.workspace = true
tracing.workspace = true
calamine = "0.36.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Android has no Trash; discarded files are deleted there
[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5"

[dev-dependencies]
corvene-test-support.workspace = true
