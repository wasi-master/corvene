[package]
name = "corvene-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Corvene application state, models and dispatcher"

[dependencies]
corvene-git.workspace = true
corvene-extensions.workspace = true
corvene-highlight.workspace = true
corvene-packs.workspace = true
corvene-github.workspace = true
corvene-hosts.workspace = true
corvene-models.workspace = true
corvene-platform.workspace = true
corvene-store.workspace = true
gpui-kit = { workspace = true, default-features = false, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
rust-embed = { workspace = true, features = ["include-exclude"] }
notify = "7"
dunce = "1"
regex.workspace = true
similar.workspace = true
hayro.workspace = true
kurbo.workspace = true
pulldown-cmark.workspace = true
imagesize = "0.14"
async-channel = "2"
yaml-rust = "0.4"

[features]
# The GPUI host (`host::gpui`): `App`/`Context<V>` implement `host::Host` so the
# desktop UI passes its `cx` straight to the dispatcher. Off for the Android
# FFI library, which drives the dispatcher from `host::LocalHost`.
default = ["gpui"]
gpui = ["dep:gpui-kit"]
# `host::LocalHost` outside Android and tests (the FFI crate turns it on).
local-host = []

[dev-dependencies]
tempfile = "3"
smol = "2"
corvene-test-support.workspace = true
